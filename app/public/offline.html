<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>RSOS Offline</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0b0b0b;
        color: #f5d06b;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid #7b5a1b;
        background: #17110a;
        border-radius: 16px;
        padding: 20px;
      }
      h1 { margin: 0 0 8px; font-size: 1.3rem; }
      p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Royal Star Operating System</h1>
      <p>RSOS is offline. Viewing cached interface only. Changes cannot be saved.</p>
    </div>
  </body>
</html>
